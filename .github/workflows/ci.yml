name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - run: poetry run ruff check .
      - run: poetry run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Test
        run: poetry run pytest

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dothours
          POSTGRES_PASSWORD: dothours
          POSTGRES_DB: dothours
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dothours"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://dothours:dothours@localhost:5432/dothours
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Only one migration head
        run: |
          heads=$(poetry run alembic heads | grep -c '(head)')
          test "$heads" -eq 1 || { poetry run alembic heads; exit 1; }

      # One revision at a time, each in its own transaction. A single
      # `upgrade head` hides bugs that only appear on an existing database —
      # re-creating an enum another revision already made, for instance.
      - name: Upgrade one revision at a time
        run: |
          set -eu
          while :; do
            before=$(poetry run alembic current 2>/dev/null | tail -1)
            poetry run alembic upgrade +1
            after=$(poetry run alembic current 2>/dev/null | tail -1)
            [ "$before" = "$after" ] && break
          done
          poetry run alembic current

      - name: Models match the schema
        run: poetry run alembic check

      - name: Downgrade to base and back up
        run: |
          poetry run alembic downgrade base
          poetry run alembic upgrade head
          poetry run alembic check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
