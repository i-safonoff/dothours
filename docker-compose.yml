services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dothours
      POSTGRES_PASSWORD: dothours
      POSTGRES_DB: dothours
    ports:
      - "5432:5432"
    volumes:
      - dothours_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dothours"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://dothours:dothours@db:5432/dothours
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dothours_db_data:
